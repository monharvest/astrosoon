backend:
  name: test-repo

local_backend: true

media_folder: "src/assets/posts"
public_folder: "/src/assets/posts"

collections:
  - name: posts
    label: Нийтлэлүүд
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - label: Гарчиг
        name: title
        widget: string
      - label: Тайлбар
        name: description
        widget: text
        required: false
      - label: Нийтэлсэн огноо
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: ""
      - label: Шинэчилсэн огноо
        name: updatedDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: Ангилал
        name: category
        widget: select
        options:
          - Сайн мэдээ
          - Үхэл ба амилал
          - Сургаалт зүйрлэлүүд
          - Мөнх үгийн ойлголт
          - Тамын тухай
      - label: Түлхүүр үгс
        name: tags
        widget: list
        default: []
        required: false
      - label: Зураг
        name: heroImage
        widget: image
        # Written into frontmatter relative to the .md file — the collection
        # schema resolves it with Astro's image() helper, so a /public path
        # would fail the build.
        media_folder: "../../assets/posts"
        public_folder: "../../assets/posts"
        required: false
      - label: Онцлох
        name: featured
        widget: boolean
        default: false
      - label: PDF файл
        name: pdfUrl
        widget: file
        required: false
        media_folder: "../../../public/pdfs"
        public_folder: "/pdfs"
      - label: Агуулга
        name: body
        widget: markdown
